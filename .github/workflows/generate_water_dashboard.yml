name: Generate Water Dashboard

on:
  push:
    branches:
      - main
    paths:
      - "water_log.csv"

  workflow_dispatch: {}

# Shared with generate_dashboard.yml and sync_food_library.yml on purpose. All three
# workflows auto-commit to main, so they must not push at the same time. cancel-in-progress
# stays false: this job regenerates its artifact from the full water_log.csv, so the newest
# queued run produces a correct result regardless of what it skipped.
concurrency:
  group: main-writer
  cancel-in-progress: false

jobs:
  generate-water-dashboard:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run generate_water_dashboard.py
        run: |
          python generate_water_dashboard.py --water-log water_log.csv --dashboard Water_Data_Dashboard.csv

      - name: Commit and push updated dashboard
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          regenerate() {
            python generate_water_dashboard.py --water-log water_log.csv --dashboard Water_Data_Dashboard.csv
          }

          for attempt in 1 2 3; do
            git add Water_Data_Dashboard.csv
            if git diff --cached --quiet; then
              echo "No changes to commit - dashboard already up to date"
              exit 0
            fi
            git commit -q -m "chore: update Water_Data_Dashboard [skip ci]"

            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi

            # Water_Data_Dashboard.csv is a GENERATED artifact, derived entirely from
            # water_log.csv. Rebasing it is always wrong: two independently generated
            # CSVs conflict line-by-line. Instead discard our commit, take whatever
            # main now has, and regenerate on top of it. Same recovery as
            # generate_dashboard.yml.
            echo "Push rejected (attempt $attempt) - taking origin/main and regenerating."
            git fetch origin main
            git reset --hard FETCH_HEAD
            regenerate
          done

          echo "::error::Could not push Water_Data_Dashboard.csv after 3 attempts."
          exit 1

      - name: Trigger Health Tracker consolidation
        if: success()
        env:
          DISPATCH_TOKEN: ${{ secrets.HEALTH_TRACKER_DISPATCH_TOKEN }}
          GH_USERNAME:    ${{ secrets.GH_USERNAME }}
        run: |
          # Notify Health-Tracker directly (it listens for `water_updated`). Water is a
          # warn-only third source there, so a failed dispatch never blocks the
          # WHOOP+meal merge; Health-Tracker's scheduled run picks it up later.
          curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/$GH_USERNAME/Health-Tracker/dispatches \
            -d '{"event_type": "water_updated"}' \
          | grep -q "204" && echo "Dispatch sent successfully." \
                          || echo "WARNING: Dispatch failed — scheduled fallback will run."
