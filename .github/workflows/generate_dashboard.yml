name: Generate Dashboard

on:
  push:
    branches:
      - main
    paths:
      - "meal_log.csv"
      - "user_goals.csv"

  workflow_dispatch:
    inputs:
      recompute_from:
        description: >
          Optional: YYYY-MM-DD. Recompute all dashboard rows on or after
          this date. Use after editing user_goals.csv to apply new goals
          to historical dates. Leave blank for a normal incremental run.
        required: false
        default: ""

concurrency:
  group: generate-dashboard
  cancel-in-progress: false

jobs:
  generate-dashboard:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Detect changed files
        id: changed
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          echo "Changed files: $CHANGED"
          if echo "$CHANGED" | grep -q "user_goals.csv"; then
            echo "goals_changed=true" >> $GITHUB_OUTPUT
            PREV_DATES=$(git show HEAD~1:user_goals.csv | tail -n +2 | cut -d',' -f3 | sort)
            ALL_DATES=$(tail -n +2 user_goals.csv | cut -d',' -f3 | sort)
            NEW_DATE=$(comm -13 <(echo "$PREV_DATES") <(echo "$ALL_DATES") | head -1)
            if [ -n "$NEW_DATE" ]; then
              echo "recompute_from=$NEW_DATE" >> $GITHUB_OUTPUT
              echo "New goal effective_date detected: $NEW_DATE"
            else
              echo "recompute_from=" >> $GITHUB_OUTPUT
              echo "No new effective_date found — running normal incremental"
            fi
          else
            echo "goals_changed=false" >> $GITHUB_OUTPUT
            echo "recompute_from=" >> $GITHUB_OUTPUT
          fi

      - name: Resolve recompute flag
        id: recompute
        run: |
          MANUAL="${{ github.event.inputs.recompute_from }}"
          AUTO="${{ steps.changed.outputs.recompute_from }}"
          if [ -n "$MANUAL" ]; then
            echo "date=$MANUAL" >> $GITHUB_OUTPUT
            echo "Using manual recompute-from: $MANUAL"
          elif [ -n "$AUTO" ]; then
            echo "date=$AUTO" >> $GITHUB_OUTPUT
            echo "Using auto-detected recompute-from: $AUTO"
          else
            echo "date=" >> $GITHUB_OUTPUT
            echo "No recompute-from — incremental run"
          fi

      - name: Run generate_dashboard.py
        run: |
          RECOMPUTE="${{ steps.recompute.outputs.date }}"
          if [ -n "$RECOMPUTE" ]; then
            python generate_dashboard.py --meal-log meal_log.csv --food-library food_library.csv --user-goals user_goals.csv --dashboard Meal_Data_Dashboard.csv --recompute-from "$RECOMPUTE"
          else
            python generate_dashboard.py --meal-log meal_log.csv --food-library food_library.csv --user-goals user_goals.csv --dashboard Meal_Data_Dashboard.csv
          fi

      - name: Commit and push updated dashboard
        env:
          RECOMPUTE: ${{ steps.recompute.outputs.date }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          regenerate() {
            if [ -n "$RECOMPUTE" ]; then
              python generate_dashboard.py --meal-log meal_log.csv --food-library food_library.csv --user-goals user_goals.csv --dashboard Meal_Data_Dashboard.csv --recompute-from "$RECOMPUTE"
            else
              python generate_dashboard.py --meal-log meal_log.csv --food-library food_library.csv --user-goals user_goals.csv --dashboard Meal_Data_Dashboard.csv
            fi
          }

          for attempt in 1 2 3; do
            git add Meal_Data_Dashboard.csv
            if git diff --cached --quiet; then
              echo "No changes to commit - dashboard already up to date"
              exit 0
            fi
            git commit -q -m "chore: update Meal_Data_Dashboard [skip ci]"

            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi

            # Meal_Data_Dashboard.csv is a GENERATED artifact, derived entirely from
            # meal_log.csv + food_library.csv + user_goals.csv. Rebasing it is always
            # wrong: two independently generated CSVs conflict line-by-line and the
            # rebase halts (this is what killed the 2026-07-25 run). Instead discard
            # our commit, take whatever main now has, and regenerate on top of it.
            echo "Push rejected (attempt $attempt) - taking origin/main and regenerating."
            git fetch origin main
            git reset --hard FETCH_HEAD
            regenerate
          done

          echo "::error::Could not push Meal_Data_Dashboard.csv after 3 attempts."
          exit 1

      - name: Trigger Health Tracker consolidation
        if: success()
        env:
          DISPATCH_TOKEN: ${{ secrets.HEALTH_TRACKER_DISPATCH_TOKEN }}
          GH_USERNAME:    ${{ secrets.GH_USERNAME }}
        run: |
          # Notify Health-Tracker directly (it listens for `meal_updated`). Meal logs
          # no longer route through whoop-data, so food updates never depend on a
          # WHOOP OAuth sync succeeding and a dead WHOOP band can't block them.
          curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/$GH_USERNAME/Health-Tracker/dispatches \
            -d '{"event_type": "meal_updated"}' \
          | grep -q "204" && echo "Dispatch sent successfully." \
                          || echo "WARNING: Dispatch failed — scheduled fallback will run."
